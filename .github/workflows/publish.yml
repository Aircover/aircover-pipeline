name: Publish to PyPI

# Triggered when a tag matching v* is pushed (e.g., v1.0.3, v1.1.0).
# Uses PyPI Trusted Publishing (OIDC) — no API tokens stored as secrets.
# See PUBLISHING.md for the one-time PyPI + GitHub Environment setup.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/aircover-pipeline

    permissions:
      id-token: write  # required for OIDC / Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify built artifacts
        run: |
          ls -la dist/
          twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
