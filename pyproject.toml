[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircover-pipeline"
version = "1.0.3"
description = "End-to-end Aircover pipeline: pull meetings + run a coaching agent on each."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [{ name = "Aircover, Inc.", email = "support@aircover.ai" }]
keywords = ["aircover", "sales", "coaching", "api"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.urls]
# Note: PEP 621 / setuptools >=79 requires URL values here. The support
# email is in [project.authors] and in the README; don't add it here.
Homepage = "https://aircover.ai"
Documentation = "https://app.aircover.ai"

[project.scripts]
aircover-pipeline = "aircover_pipeline:main"

[tool.setuptools]
py-modules = ["aircover_client", "aircover_pipeline"]
